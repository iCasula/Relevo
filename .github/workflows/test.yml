name: Tests

on:
  push:
    branches: [main]
    paths: ['Host/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['Host/**']

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Unit tests, then the whole host with the echo agent: pairing, TLS-PSK, a turn, a permission, a relay,
      # the desktop page and its gateway — the first real run on Windows.
      - run: node --test 'Host/test/*.test.mjs'
