<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relevo</title>
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><img src="icon.png" alt=""><span>Relevo</span></div>
      <nav id="hosts" aria-label="Hosts e hilos"></nav>
      <div id="update-slot"></div>
      <footer class="side-foot">
        <button class="side-link" data-view="limits">Límites</button>
        <button class="side-link" data-view="hosts">Hosts</button>
      </footer>
    </aside>
    <main id="main"></main>
  </div>
  <div id="offline" hidden>Reconectando con el servicio de Relevo de este equipo…</div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
